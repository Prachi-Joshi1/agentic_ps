<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111113'/%3E%3Cpath d='M6 16h5l4-9 5 18 4-9h2' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Geist if online; never render-blocking, so the console works offline with system fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --ground: #F6F6F3; --rail: #FBFBF9; --surface: #FFFFFF; --sunk: #F6F6F3; --line: #E6E6E1; --line-soft: #F0F0EC;
  --ink: #111113; --ink-2: #3B3B41; --ink-3: #4A4A50; --muted: #5F5F66; --faint: #8A8A90;
  --blue: #2F4FE0; --blue-soft: #EEF1FE; --green: #15803D; --green-soft: #E9F6EE; --red: #B42318; --red-soft: #FDEEEC;
  --orange: #C2410C; --orange-dot: #EA580C; --orange-soft: #FFF1E6; --orange-line: #F3C9A8; --orange-glow: #FFF4EC;
  --gray-dot: #A3A3A8;
  --sans: Geist, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; } a:hover { color: #1F37B0; }
.mono { font-family: var(--mono); }
.sr { position: absolute; left: -9999px; }
svg { flex: none; }

.app { min-height: 100vh; display: flex; flex-wrap: wrap; }

/* rail */
.rail { flex: 1 1 232px; max-width: 232px; min-width: 200px; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px;
  border-right: 1px solid var(--line); background: var(--rail); position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #55555B; font-weight: 450; }
.nav a:hover { background: #F0F0EB; color: var(--ink); }
.nav a.on { background: #EDEDE8; color: var(--ink); font-weight: 500; }
.health { margin-top: auto; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.health .h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.health .rows { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.health .rows div { display: flex; justify-content: space-between; gap: 8px; } .health .rows span:last-child { color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--gray-dot); }
.dot.ok { background: var(--green); } .dot.busy { background: var(--blue); } .dot.warn { background: var(--orange-dot); } .dot.bad { background: var(--red); }
.dot.pulse { box-shadow: 0 0 0 0 rgba(47,79,224,.45); animation: pulse 1.6s infinite; }
.dot.warn.pulse { box-shadow: 0 0 0 0 rgba(234,88,12,.45); animation: pulse-o 1.6s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(47,79,224,0); } 100% { box-shadow: 0 0 0 0 rgba(47,79,224,0); } }
@keyframes pulse-o { 70% { box-shadow: 0 0 0 7px rgba(234,88,12,0); } 100% { box-shadow: 0 0 0 0 rgba(234,88,12,0); } }

@media (max-width: 860px) {
  .rail { max-width: none; flex-basis: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px 16px; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; flex-wrap: wrap; } .health { display: none; }
}

/* main */
.main { flex: 999 1 560px; min-width: 0; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 24px; }
@media (max-width: 640px) { .main { padding: 20px 16px 40px; } }
.top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.top .when { font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: .02em; }
.top h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.chip-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; }
.chip-pill b { font-family: var(--mono); font-weight: 500; }
.chip-pill.wait { background: var(--orange-soft); color: #9A3412; border-color: transparent; font-weight: 600; }
.chip-pill.run { background: var(--blue-soft); color: var(--blue); border-color: transparent; font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.card-t { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-t .n { color: var(--faint); font-weight: 400; }
.card-t a, .card-t .r { margin-left: auto; font-size: 12px; font-weight: 400; }

/* composer */
.composer { padding: 8px; box-shadow: 0 1px 2px rgba(17,17,19,.04); transition: box-shadow .15s, border-color .15s; }
.composer:focus-within { border-color: #CDD5FB; box-shadow: 0 0 0 4px var(--blue-soft); }
.c-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 14px; flex-wrap: wrap; }
.c-row textarea { flex: 1 1 300px; min-width: 0; border: 0; outline: none; font-size: 16px; padding: 10px 0; background: transparent; resize: none; height: 44px; line-height: 24px; overflow: hidden; }
.c-row textarea::placeholder { color: var(--faint); }
.select { font-size: 13px; color: var(--ink-2); border: 1px solid var(--line); background: var(--rail); border-radius: 10px; padding: 0 12px; min-height: 40px; max-width: 220px; }
.btn { border: 0; border-radius: 10px; padding: 0 18px; min-height: 40px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: transform .05s, background .15s, opacity .15s; }
.btn:active { transform: translateY(1px); } .btn:disabled { opacity: .5; cursor: default; }
.btn.dark { background: var(--ink); color: #fff; } .btn.dark:hover { background: #2A2A2F; }
.btn.line { background: var(--surface); color: var(--ink-2); border: 1px solid #E0E0DA; } .btn.line:hover { background: var(--rail); }
.btn.quiet { background: transparent; color: var(--muted); padding: 0 10px; } .btn.quiet:hover { color: var(--red); background: var(--red-soft); }
.btn .k { font-family: var(--mono); font-size: 11px; opacity: .6; font-weight: 400; }
.c-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 14px 8px; border-top: 1px solid var(--line-soft); }
.ex { font-size: 12.5px; color: var(--ink-2); background: var(--sunk); border: 1px solid #ECECE7; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.ex:hover { border-color: #CDD5FB; color: var(--blue); background: var(--blue-soft); }
.c-msg { margin-left: auto; font-size: 12.5px; color: var(--muted); }

/* approval */
.approval { border: 1px solid var(--orange-line); border-radius: 20px; background: var(--surface); box-shadow: 0 0 0 6px var(--orange-glow), 0 12px 32px rgba(154,52,18,.08);
  display: flex; flex-wrap: wrap; overflow: hidden; animation: rise .3s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.ap-l { flex: 1 1 420px; min-width: 0; padding: 32px 36px; display: flex; flex-direction: column; gap: 22px; }
.ap-badge { display: flex; align-items: center; gap: 10px; }
.ap-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--orange-soft); display: grid; place-items: center; }
.ap-badge .t1 { display: block; font-size: 12px; font-weight: 600; color: var(--orange); letter-spacing: .04em; }
.ap-badge .t2 { display: block; font-size: 12px; color: var(--muted); }
.ap-l h2 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; }
.ap-l p { margin: 0; font-size: 15px; color: var(--ink-3); max-width: 560px; }
.ap-facts { border: 1px solid #ECECE7; border-radius: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: hidden; }
.ap-facts div { padding: 14px 16px; } .ap-facts div:nth-child(odd) { border-right: 1px solid #ECECE7; }
.ap-facts div:nth-child(-n+2) { border-bottom: 1px solid #ECECE7; }
.ap-facts small { display: block; font-size: 12px; color: var(--muted); } .ap-facts b { font-weight: 600; word-break: break-word; }
.ap-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ap-actions .btn { min-height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.ap-actions .also { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.ap-r { flex: 1 1 360px; min-width: 0; background: #FBFAF7; border-left: 1px solid #F0E6DC; padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.ap-shot { width: 100%; max-width: 420px; border-radius: 16px; background: var(--surface); border: 1px solid #ECECE7; box-shadow: 0 6px 20px rgba(17,17,19,.06); overflow: hidden; cursor: zoom-in; }
.ap-shot img { width: 100%; display: block; }
.ap-timer { text-align: center; } .ap-timer .v { font-family: var(--mono); font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
.ap-timer .l { font-size: 12px; color: var(--muted); }
.ap-bar { width: 100%; max-width: 420px; height: 4px; border-radius: 4px; background: #EFE7DF; overflow: hidden; }
.ap-bar div { height: 4px; background: var(--orange-dot); transition: width 1s linear; }

/* grid */
.cols { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.live { flex: 999 1 560px; min-width: 0; overflow: hidden; }
.side { flex: 1 1 300px; min-width: 0; max-width: 380px; display: flex; flex-direction: column; gap: 24px; }
@media (max-width: 1200px) { .side { max-width: none; } }

/* live run */
.lv-h { padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--line-soft); }
.lv-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.lv-meta .right { margin-left: auto; font-family: var(--mono); }
.badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: #F1F1EE; color: var(--ink-2); }
.badge.running { background: var(--blue-soft); color: var(--blue); } .badge.done, .badge.succeeded { background: var(--green-soft); color: var(--green); }
.badge.failed, .badge.crashed, .badge.error { background: var(--red-soft); color: var(--red); }
.badge.waiting { background: var(--orange-soft); color: var(--orange); }
.lv-task { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; }
.phases { display: grid; gap: 6px; }
.ph { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ph i { height: 4px; border-radius: 4px; background: var(--ink); display: block; }
.ph span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph.now i { background: var(--blue); } .ph.now span { font-weight: 600; }
.ph.wait i { background: var(--orange-dot); }
.ph.fail i { background: var(--red); }
.lv-b { display: flex; flex-wrap: wrap; }
.screen { flex: 1 1 420px; min-width: 0; padding: 18px 22px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 10px; }
.screen .cap { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
.screen .cap .u { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
.frame { border-radius: 10px; border: 1px solid var(--line); background: #F1F1EE; overflow: hidden; display: flex; flex-direction: column; }
.frame .bar { height: 26px; background: #E9E9E5; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
.frame .bar span { width: 8px; height: 8px; border-radius: 50%; background: #D3D3CE; }
.frame .view { aspect-ratio: 16 / 10; display: grid; place-items: center; color: var(--faint); font-size: 13px; cursor: zoom-in; }
.frame .view img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.screen .why { font-size: 13px; color: var(--ink-3); }
.feed { flex: 1 1 360px; min-width: 0; padding: 18px 22px; display: flex; flex-direction: column; max-height: 640px; }
.feed .cap { font-size: 12px; color: var(--muted); padding-bottom: 6px; display: flex; }
.feed .cap span:last-child { margin-left: auto; }
.rows { overflow-y: auto; margin-right: -10px; padding-right: 10px; }
.row { display: flex; gap: 12px; padding: 10px 6px; margin: 0 -6px; border-bottom: 1px solid #F3F3EF; border-radius: 8px; width: calc(100% + 12px); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; }
.row:hover { background: #FAFAF8; } .row.sel { background: var(--blue-soft); }
.n { width: 26px; height: 26px; flex: none; border-radius: 8px; background: #F1F1EE; color: var(--ink-2); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-family: var(--mono); }
.n.cur { background: var(--blue-soft); color: var(--blue); } .n.err { background: var(--red-soft); color: var(--red); }
.n.guard { background: var(--green-soft); color: var(--green); } .n.guard.bad { background: var(--red-soft); color: var(--red); }
.n.ask { background: var(--orange-soft); color: var(--orange); } .n.fin { background: var(--ink); color: #fff; }
.rb { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rt { display: flex; gap: 8px; align-items: baseline; } .rt b { font-weight: 600; font-size: 13px; } .rt .tm { font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
.rw { font-size: 13px; color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rr { font-family: var(--mono); font-size: 11.5px; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr.err { color: var(--red); } .rr.dim { color: var(--muted); }
.empty { padding: 56px 24px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--sunk); display: grid; place-items: center; }
.empty b { color: var(--ink); font-weight: 600; font-size: 15px; }

/* side */
.pad { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.sched { display: flex; align-items: center; gap: 12px; } .sched + .sched { padding-top: 12px; border-top: 1px solid #F3F3EF; }
.sched .nm { display: flex; flex-direction: column; } .sched .nm span:first-child { font-weight: 500; } .sched .nm span:last-child { font-size: 12px; color: var(--muted); }
.sched .cd { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--blue); white-space: nowrap; }
.runs { display: flex; flex-direction: column; }
.run { display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; margin: 0 -8px; border-top: 1px solid #F3F3EF; border-radius: 8px; color: var(--ink);
  background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; width: calc(100% + 16px); }
.run:hover { background: #FAFAF8; } .run.sel { background: var(--blue-soft); }
.run .dot { margin-top: 6px; }
.run .rb2 { min-width: 0; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.run .t { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .m { font-size: 12px; color: var(--muted); }
.run .rp { font-size: 12px; margin-left: 4px; }
.skills { display: flex; flex-wrap: wrap; gap: 6px; }
.skill { font-size: 12px; padding: 5px 10px; border-radius: 8px; background: var(--sunk); border: 1px solid #ECECE7; }
.skill.draft { border-style: dashed; color: var(--muted); }
.msgs { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
.msg { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; color: var(--ink-3); padding-bottom: 8px; border-bottom: 1px solid #F3F3EF; }
.msg .tm { display: block; font-family: var(--mono); font-size: 11px; color: var(--faint); }

#zoom { position: fixed; inset: 0; background: rgba(17,17,19,.82); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; cursor: zoom-out; }
#zoom img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 24px 64px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand"><span class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12h4l3-7 4 14 3-7h2"/></svg></span>Harness</div>
    <div class="nav">
      <a href="#top" class="on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>Console</a>
      <a href="#runs"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Runs</a>
      <a href="#skills"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/></svg>Skills</a>
      <a href="#schedules"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Schedules</a>
    </div>
    <div class="health" id="health">
      <div class="h"><span class="dot"></span>Connecting…</div>
    </div>
  </nav>

  <main class="main" id="top">
    <header class="top">
      <div>
        <div class="when" id="when">—</div>
        <h1>Console</h1>
      </div>
      <div class="chip-pill" id="pill">—</div>
    </header>

    <div id="asks"></div>

    <section class="card composer" aria-label="New task">
      <div class="c-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A90" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <label for="task" class="sr">Task</label>
        <textarea id="task" rows="1" placeholder="What should the agent do?"></textarea>
        <label for="skill" class="sr">Skill</label>
        <select id="skill" class="select"><option value="">Auto-pick skill</option></select>
        <button class="btn dark" id="go">Run<span class="k">Ctrl ↵</span></button>
      </div>
      <div class="c-foot">
        <button class="ex" data-ex="Make an Excel sheet on my Desktop with the top 5 Hacker News headlines and their links">Top 5 Hacker News headlines → Excel on Desktop</button>
        <button class="ex" data-ex="Organise my Downloads folder into subfolders by file type">Tidy Downloads by file type</button>
        <button class="ex" data-ex="Play a popular music video on YouTube">Play a music video on YouTube</button>
        <span class="c-msg" id="gomsg"></span>
      </div>
    </section>

    <div class="cols">
      <section class="card live" aria-label="Run" id="live">
        <div class="empty">
          <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F5F66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg></span>
          <b>No run open</b>
          <span>Give the agent a task above, or open a past run from the list.</span>
        </div>
      </section>

      <aside class="side">
        <section class="card pad" id="schedules" aria-label="Up next">
          <div class="card-t">Up next</div>
          <div id="jobs"></div>
        </section>
        <section class="card pad" id="runs" aria-label="Recent runs">
          <div class="card-t">Recent runs <span class="n" id="runcount"></span></div>
          <div class="runs" id="runlist"></div>
        </section>
        <section class="card pad" id="skills" aria-label="Skills">
          <div class="card-t">Skills <span class="n" id="skillcount"></span></div>
          <div class="skills" id="skilllist"></div>
        </section>
        <section class="card pad" aria-label="Agent messages">
          <div class="card-t">Agent messages</div>
          <div class="msgs" id="msgs"></div>
        </section>
      </aside>
    </div>
  </main>
</div>
<div id="zoom" role="dialog" aria-label="Screenshot"><img alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pretty = (p) => { const s = String(p || "").replace(/^STATE_/, "").replace(/_/g, " ").toLowerCase().trim(); return s ? s[0].toUpperCase() + s.slice(1) : ""; };
const toDate = (s) => new Date(String(s).replace(" ", "T"));
function dur(ms) {
  ms = Math.max(0, ms); const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  if (d) return `${d}d ${h}h`; if (h) return `${h}h ${String(m).padStart(2, "0")}m`; if (m) return `${m}m ${String(x).padStart(2, "0")}s`; return `${x}s`;
}
const clockFmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const STATUS_DOT = {done: "ok", succeeded: "ok", running: "busy", failed: "bad", crashed: "bad", error: "bad"};
const TOOL_NAMES = {"browser.click": "Click", "browser.type": "Type", "browser.open": "Open page", "browser.scroll": "Scroll", "browser.wait_for": "Wait for page",
  "browser.press": "Press key", "browser.read": "Read page", "browser.focus": "Focus", "browser.eval": "Check page", "browser.screenshot": "Save screenshot", "browser.select": "Select", "desktop.click": "Click", "desktop.type": "Type", "desktop.open": "Open",
  "shell.run": "Run command", "file.read": "Read file", "file.write": "Write file", "vision.read_text": "Read text", "vision.ocr_into": "Solve captcha",
  "clock.wait_until": "Wait for time", "wait": "Wait", "human.ask": "Ask the human", "task.done": "Finish", "task.fail": "Give up", "task.note": "Note"};
function actionTitle(acts) {
  if (!acts || !acts.length) return "Look";
  const a = acts[0];
  let t = a.tool === "skill.run_macro" ? `Macro · ${String((a.args || {}).name || "").replace(/_/g, " ")}` : (TOOL_NAMES[a.tool] || a.tool);
  return acts.length > 1 ? `${t} +${acts.length - 1}` : t;
}

let S = null, selected = null, follow = true, after = 0, records = [], meta = null, pickedStep = null, askSig = "", sideSig = "", skillsLoaded = false, askSeen = {};

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------------- header + rail ---------------- */
function renderTop(s) {
  const now = toDate(s.clock);
  $("when").textContent = now.toLocaleDateString("en-GB", {weekday: "short", day: "2-digit", month: "short"}).toUpperCase().replace(",", "") + " · " + s.clock.slice(11) + " IST";
  const pill = $("pill");
  const next = s.jobs.map((j) => ({...j, at: toDate(j.next).getTime()})).sort((a, b) => a.at - b.at)[0];
  if (s.asks.length) { pill.className = "chip-pill wait"; pill.innerHTML = `<span class="dot warn pulse"></span>Waiting for you`; }
  else if (s.running) { pill.className = "chip-pill run"; pill.innerHTML = `<span class="dot busy pulse"></span>Working · step ${s.running.step || 0}${s.running.phase ? " · " + esc(pretty(s.running.phase)) : ""}`; }
  else if (next) { pill.className = "chip-pill"; pill.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2F4FE0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(next.id.replace("sched:", "").replace(/_/g, " "))} in <b>${dur(next.at - now.getTime())}</b>`; }
  else { pill.className = "chip-pill"; pill.innerHTML = `<span class="dot ok"></span>Idle · ready`; }
  const h = s.health;  // absent from a daemon started before this page existed
  const ch = h ? (h.channels || []) : null;
  $("health").innerHTML = `<div class="h"><span class="dot ok"></span>Daemon online</div><div class="rows">
    <div><span>Clock (NTP)</span><span class="mono">${h && h.ntp_offset_ms != null ? (h.ntp_offset_ms >= 0 ? "+" : "") + Math.round(h.ntp_offset_ms) + " ms" : "—"}</span></div>
    <div><span>Telegram</span><span>${!h ? "—" : ch.includes("telegram") ? "connected" : "off"}</span></div>
    <div><span>Email trigger</span><span>${!h ? "—" : h.email ? "watching" : "off"}</span></div>
    <div><span>Uptime</span><span class="mono">${dur(s.uptime_s * 1000)}</span></div></div>`;
}

/* ---------------- approval ---------------- */
function renderAsks(s) {
  const asks = s.asks;
  const sig = JSON.stringify(asks.map((a) => a.id));
  for (const a of asks) if (!askSeen[a.id]) askSeen[a.id] = Date.now() - a.age_s * 1000;
  if (sig !== askSig) {
    askSig = sig;
    const task = s.running ? s.running.task : "";
    $("asks").innerHTML = asks.map((a) => {
      const q = String(a.question || "");
      const cut = q.search(/[.?!](\s|$)/);
      const head = cut > 20 && cut < 140 ? q.slice(0, cut + 1) : (q.length > 140 ? q.slice(0, 138) + "…" : q);
      const rest = head.length < q.length ? q.slice(head.length).trim() : "";
      return `<section class="approval" aria-label="Approval needed">
        <div class="ap-l">
          <div class="ap-badge"><span class="ap-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9"/></svg></span>
            <span><span class="t1">${/pay|upi|qr|₹/i.test(q) ? "APPROVAL NEEDED" : "THE AGENT NEEDS YOU"}</span><span class="t2">${/pay|upi|qr|₹/i.test(q) ? "The only step a human takes" : "The run is paused until you answer"}</span></span></div>
          <div style="display:flex;flex-direction:column;gap:10px"><h2>${esc(head)}</h2>${rest ? `<p>${esc(rest)}</p>` : ""}</div>
          ${task ? `<div class="ap-facts"><div><small>Task</small><b>${esc(task.length > 90 ? task.slice(0, 88) + "…" : task)}</b></div><div><small>Skill</small><b>${esc((S && S.running && meta && meta.skill) || "auto")}</b></div>
            <div><small>Step</small><b>${s.running.step || 0} · ${esc(pretty(s.running.phase) || "—")}</b></div><div><small>Answer from</small><b>Here or Telegram</b></div></div>` : ""}
          <div class="ap-actions">${a.options.map((o, i) => `<button class="btn ${i === 0 ? "dark" : "line"}" data-ask="${a.id}" data-ans="${esc(o)}">${esc(o)}</button>`).join("")}
            <span class="also"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 4L3 11l7 3 3 7z"/></svg>Also sent to Telegram</span></div>
        </div>
        <div class="ap-r">
          ${a.image ? `<div class="ap-shot"><img src="/api/ask/${a.id}.jpg" alt="The agent's screen when it asked" data-zoom></div>` : ""}
          ${a.timeout_s ? `<div class="ap-timer"><div class="v" data-timer="${a.id}">—</div><div class="l">until this request times out</div></div><div class="ap-bar"><div data-bar="${a.id}" style="width:100%"></div></div>` : ""}
        </div>
      </section>`;
    }).join("");
  }
  tickAsks();
}
function tickAsks() {
  if (!S) return;
  for (const a of S.asks) {
    const left = a.timeout_s * 1000 - (Date.now() - askSeen[a.id]);
    const v = document.querySelector(`[data-timer="${a.id}"]`); if (v) v.textContent = clockFmt(left);
    const b = document.querySelector(`[data-bar="${a.id}"]`); if (b) b.style.width = `${Math.max(0, Math.min(100, left / (a.timeout_s * 10)))}%`;
  }
}

/* ---------------- side ---------------- */
function renderSide(s) {
  const now = toDate(s.clock).getTime();
  $("jobs").innerHTML = s.jobs.length ? s.jobs.map((j) => `<div class="sched"><div class="nm"><span>${esc(j.id.replace("sched:", "").replace(/_/g, " "))}</span><span>${esc(j.next.slice(0, 16))} IST</span></div>
    <span class="cd">in ${dur(toDate(j.next).getTime() - now)}</span></div>`).join("") : `<div class="m" style="color:var(--muted);font-size:13px">Nothing scheduled.</div>`;
  const sig = JSON.stringify([s.runs, s.skills, s.feed.length, selected]);
  if (sig === sideSig) return;
  sideSig = sig;
  $("runcount").textContent = s.runs.length;
  $("runlist").innerHTML = s.runs.map((r) => `<button class="run ${r.run_id === selected ? "sel" : ""}" data-run="${esc(r.run_id)}">
      <span class="dot ${STATUS_DOT[r.status] || ""}"></span>
      <span class="rb2"><span class="t">${esc(r.task)}</span>
      <span class="m">${esc(r.status)} · ${r.steps} steps${r.handoffs ? ` · ${r.handoffs} handoff${r.handoffs === 1 ? "" : "s"}` : ""} · ${esc(r.started.slice(11, 16))}${r.started.slice(0, 10) !== s.clock.slice(0, 10) ? " " + esc(r.started.slice(8, 10) + "/" + r.started.slice(5, 7)) : ""}</span></span>
    </button>`).join("") || `<div style="color:var(--muted);font-size:13px">No runs yet.</div>`;
  $("skillcount").textContent = s.skills.length;
  $("skilllist").innerHTML = s.skills.map((k) => `<span class="skill ${k.draft ? "draft" : ""}" title="${esc(k.description)}">${esc(k.name.replace(/_/g, " "))}</span>`).join("");
  if (!skillsLoaded && s.skills.length) { $("skill").innerHTML += s.skills.map((k) => `<option value="${esc(k.name)}">${esc(k.name.replace(/_/g, " "))}</option>`).join(""); skillsLoaded = true; }
  $("msgs").innerHTML = s.feed.slice().reverse().map((m) => `<div class="msg"><span class="tm">${esc(new Date(m.ts * 1000).toLocaleTimeString("en-GB"))}</span>${esc(m.text)}</div>`).join("") || `<div style="color:var(--muted);font-size:13px">Nothing yet.</div>`;
}

/* ---------------- live run ---------------- */
function rowHtml(r, i, latestStep) {
  const t = esc((r.ist || "").slice(11, 19));
  if (r.type === "step") {
    const err = (r.results || []).some((x) => !x.ok);
    const first = (r.results || []).find((x) => !x.ok) || (r.results || [])[0];
    const res = first ? `${first.ok ? "✓" : "✗"} ${(first.summary || "").replace(/\s+/g, " ")}` : "";
    return `<button class="row ${pickedStep === i ? "sel" : ""}" data-pick="${i}">
      <span class="n ${err ? "err" : (r.step === latestStep && meta && meta.status === "running" ? "cur" : "")}">${r.step}</span>
      <span class="rb"><span class="rt"><b>${esc(actionTitle(r.actions))}</b><span class="tm">${t}</span></span>
      <span class="rw">${esc(r.thought || "")}</span>${res ? `<span class="rr ${err ? "err" : ""}">${esc(res.slice(0, 200))}</span>` : ""}</span></button>`;
  }
  if (r.event === "guard") {
    const bad = r.outcome !== "passed" && r.outcome !== "filled";
    return `<div class="row" style="cursor:default"><span class="n guard ${bad ? "bad" : ""}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg></span>
      <span class="rb"><span class="rt"><b>Safety check ${esc(r.outcome)}</b><span class="tm">${t}</span></span><span class="rr ${bad ? "err" : "dim"}">${esc(String(r.name).replace(/_/g, " "))}${r.detail ? " · " + esc(String(r.detail).slice(-160)) : ""}</span></span></div>`;
  }
  if (r.event === "handoff") return `<div class="row" style="cursor:default"><span class="n ask">?</span><span class="rb"><span class="rt"><b>Asked the human</b><span class="tm">${t}</span></span><span class="rw">${esc(r.question || "")}</span></span></div>`;
  if (r.event === "handoff_resolved") return `<div class="row" style="cursor:default"><span class="n ask">↩</span><span class="rb"><span class="rt"><b>Answer: ${esc(r.answer)}</b><span class="tm">${t}</span></span><span class="rr dim">via ${esc(r.source)} after ${esc(r.waited_s)} s</span></span></div>`;
  if (r.event === "finished") return `<div class="row" style="cursor:default"><span class="n fin">■</span><span class="rb"><span class="rt"><b>Finished · ${esc(r.status)}</b><span class="tm">${t}</span></span><span class="rw">${esc(r.summary || "")}</span></span></div>`;
  if (r.event === "started") return `<div class="row" style="cursor:default"><span class="n">▶</span><span class="rb"><span class="rt"><b>Started</b><span class="tm">${t}</span></span><span class="rr dim">skill ${esc(r.skill || "none (zero-shot)")}</span></span></div>`;
  return "";
}

function renderLive() {
  if (!meta) return;
  const steps = records.map((r, i) => [r, i]).filter(([r]) => r.type === "step");
  const latest = steps.length ? steps[steps.length - 1] : null;
  const shown = pickedStep != null ? [records[pickedStep], pickedStep] : latest;
  const live = meta.status === "running";
  const waiting = live && S && S.asks.length;
  const phases = [];
  for (const [r] of steps) if (r.phase && phases[phases.length - 1] !== r.phase) phases.push(r.phase);
  const uniq = phases.filter((p, i) => phases.indexOf(p) === i).slice(-8);
  const curPhase = latest ? latest[0].phase : null;
  const started = meta.started && meta.started.ist ? new Date(meta.started.ist).getTime() : null;
  const ended = meta.finished && meta.finished.ist ? new Date(meta.finished.ist).getTime() : null;
  const now = S ? toDate(S.clock).getTime() : Date.now();
  const status = waiting ? "waiting" : meta.status;
  const loc = shown && shown[0].location ? String(shown[0].location) : "";
  const url = loc.includes(" — ") ? loc.split(" — ").pop() : loc;
  const img = shown && shown[0].images && (shown[0].images.screen || shown[0].images.annotated);
  const feed = records.map((r, i) => rowHtml(r, i, latest ? latest[0].step : -1)).filter(Boolean).reverse().join("");

  $("live").innerHTML = `
    <div class="lv-h">
      <div class="lv-meta"><span class="badge ${esc(status)}">${live ? `<span class="dot ${waiting ? "warn" : "busy"} pulse"></span>` : ""}${esc(waiting ? "waiting for you" : meta.status)}</span>
        <span>${esc(meta.skill || "zero-shot")} · ${esc(meta.trigger || "")}</span>
        <span class="right">step ${latest ? latest[0].step : 0} · ${started ? clockFmt((ended || now) - started) : "—"}</span>
        ${live ? `<button class="btn quiet" data-stop style="min-height:28px;font-size:12px">Stop run</button>` : ""}</div>
      <div class="lv-task">${esc(meta.task)}</div>
      ${uniq.length ? `<div class="phases" style="grid-template-columns: repeat(${uniq.length}, minmax(0, 1fr))">${uniq.map((p) => {
        const cls = p === curPhase && live ? (waiting ? "wait" : "now") : (p === curPhase && /fail|crash|error/.test(meta.status) ? "fail" : "");
        return `<div class="ph ${cls}"><i></i><span>${esc(pretty(p))}</span></div>`; }).join("")}</div>` : ""}
    </div>
    <div class="lv-b">
      <div class="screen">
        <div class="cap"><span>${pickedStep != null ? `Step ${shown[0].step}` : (live ? "Agent's screen · live" : "Last screen")}</span><span class="u">${esc(url)}</span></div>
        <div class="frame"><div class="bar"><span></span><span></span><span></span></div>
          <div class="view">${img ? `<img src="/runs/${encodeURIComponent(meta.run_id)}/${esc(img)}" alt="Screen at step ${shown[0].step}" data-zoom>` : "No screenshot yet"}</div></div>
        ${shown && shown[0].thought ? `<div class="why">${esc(shown[0].thought)}</div>` : ""}
        ${meta.status !== "running" ? `<div style="font-size:13px"><a href="/runs/${encodeURIComponent(meta.run_id)}/replay.html" target="_blank" rel="noopener">Open full replay with video ↗</a></div>` : ""}
      </div>
      <div class="feed"><div class="cap"><span>Activity</span><span>${steps.length} steps</span></div><div class="rows">${feed}</div></div>
    </div>`;
}

let loadSeq = 0, loading = false;
async function loadRun(runId, reset) {
  // Overlapping polls must not append the same records twice: one poll at a time, and a reset
  // (another run opened) makes any older reply stale.
  if (loading && !reset) return;
  const seq = ++loadSeq;
  if (reset) { after = 0; records = []; meta = null; pickedStep = null; }
  const from = after;
  loading = true;
  let j;
  try { j = await api(`/api/run/${encodeURIComponent(runId)}?after=${from}`); }
  finally { if (seq === loadSeq) loading = false; }
  if (runId !== selected || seq !== loadSeq || from !== after) return;
  after = j.next;
  const changed = reset || j.records.length || !meta || meta.status !== j.meta.status || meta.steps !== j.meta.steps;
  records = records.concat(j.records);
  meta = j.meta;
  if (changed) renderLive();
}

/* ---------------- loop ---------------- */
async function tick() {
  try {
    const s = await api("/api/state");
    S = s;
    renderTop(s);
    renderAsks(s);
    renderSide(s);
    if (follow && s.running && s.running.run_id && s.running.run_id !== selected) { selected = s.running.run_id; sideSig = ""; await loadRun(selected, true); }
    else if (selected) await loadRun(selected, false);
    else if (!selected && s.runs.length && follow) { selected = s.runs[0].run_id; sideSig = ""; await loadRun(selected, true); }
  } catch (e) {
    $("health").innerHTML = `<div class="h"><span class="dot bad"></span>Daemon offline</div><div class="rows"><div><span>Start it with</span><span class="mono">harness daemon</span></div></div>`;
    $("pill").className = "chip-pill"; $("pill").innerHTML = `<span class="dot bad"></span>Not connected`;
  }
}

document.addEventListener("click", async (e) => {
  const ex = e.target.closest("[data-ex]"); if (ex) { $("task").value = ex.dataset.ex; $("task").focus(); return; }
  const b = e.target.closest("[data-ask]");
  if (b) { b.closest(".approval").querySelectorAll("button").forEach((x) => x.disabled = true);
    try { await api("/api/answer", {id: b.dataset.ask, answer: b.dataset.ans}); askSig = ""; } catch (err) { alert(err.message); } tick(); return; }
  const z = e.target.closest("[data-zoom]"); if (z) { $("zoom").querySelector("img").src = z.src; $("zoom").style.display = "flex"; return; }
  if (e.target.closest("#zoom")) { $("zoom").style.display = "none"; return; }
  if (e.target.closest("[data-stop]")) {
    if (!confirm("Stop the current run?")) return;
    try { const j = await api("/api/stop", {}); $("gomsg").textContent = j.message || ""; } catch (err) { $("gomsg").textContent = err.message; }
    return;
  }
  const p = e.target.closest("[data-pick]");
  if (p) { const i = Number(p.dataset.pick); pickedStep = pickedStep === i ? null : i; renderLive(); return; }
  const r = e.target.closest("[data-run]");
  if (r) { selected = r.dataset.run; follow = !!(S && S.running && S.running.run_id === selected); sideSig = ""; await loadRun(selected, true); if (S) renderSide(S);
    $("live").scrollIntoView({behavior: "smooth", block: "start"}); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("zoom").style.display = "none";
  // "/" jumps to the task box, as in most consoles.
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $("task").focus(); }
});
$("task").addEventListener("input", (e) => { e.target.style.height = "44px"; e.target.style.height = Math.min(160, e.target.scrollHeight) + "px"; });
$("task").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey || !e.shiftKey)) { e.preventDefault(); $("go").click(); } });
$("go").onclick = async () => {
  const task = $("task").value.trim(); if (!task) { $("task").focus(); return; }
  $("go").disabled = true;
  try { const j = await api("/api/task", {task, skill: $("skill").value}); $("gomsg").textContent = `Queued #${j.queued}${j.busy ? " · starts after the current run" : ""}`; $("task").value = ""; $("task").style.height = "44px"; follow = true; }
  catch (err) { $("gomsg").textContent = err.message; }
  $("go").disabled = false; tick();
};
tick();
setInterval(tick, 1500);
setInterval(tickAsks, 1000);
</script>
</body>
</html>
