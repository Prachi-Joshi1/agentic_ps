# Model routing. Re-read automatically when this file changes, so a model that
# starts failing can be swapped without touching code.
#
# Every entry is expanded once per API key in the provider's env var, and each
# (model, key) pair gets its own rpm/tpm budget. Free quotas are per Google
# project / Groq org: keys from the same account share one budget.
#
# Check what your keys can see with:  python -m harness doctor

providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    keys_env: GEMINI_API_KEYS
  groq:
    base_url: https://api.groq.com/openai/v1
    keys_env: GROQ_API_KEYS

groups:
  # Multimodal planner: sees the screenshot. Used for desktop apps, recovery
  # after a failed step, and whenever a skill asks for vision.
  #
  # Measured 24-Oct-2026 (screenshot + 60 elements): gemini-3.5-flash-lite 2.1-2.4 s
  # with reasoning_effort low ("none" is rejected). gemini-3.8-flash timed out
  # (>40 s) or returned 503 on the free tier, so it is not used.
  vision:
    - provider: gemini
      model: gemini-3.5-flash-lite
      vision: true
      rpm: 15
      tpm: 250000
      timeout: 12
      extra: {reasoning_effort: low}

  # Fast text planner: element list + page text only, ~200-600 ms on Groq.
  # Free TPM is small (8-12k), so prompts are kept compact.
  # (llama-3.3-70b-versatile removed: not listed for our Groq keys on 24-Oct-2026.)
  # Measured: qwen3.8-27b 0.3-0.6 s. gpt-oss-120b removed 24-Oct: in live IRCTC runs it repeatedly jumped
  # ahead of the page (e.g. clicked Pay & Book on the passenger form) and caused most stuck handoffs.
  fast:
    - provider: groq
      model: qwen/qwen3.8-27b
      rpm: 30
      tpm: 8000
      timeout: 8

# When a group has no capacity, try these groups (images are stripped for
# text-only models automatically).
fallbacks:
  vision: [fast]
  fast: [vision]

timeouts:
  connect: 5
  read: 25
